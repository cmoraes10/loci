[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loci"
version = "0.1.0"
description = "Typed long-term memory for AI agents — one core, an MCP server and a Hermes plugin"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "MOWAVE TECNOLOGIA LTDA", email = "eaemoraes123@gmail.com"},
]
keywords = ["memory", "agents", "ai", "llm", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mowavetech/loci"
Issues = "https://github.com/mowavetech/loci/issues"

[project.scripts]
loci-maintenance = "loci.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["loci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
