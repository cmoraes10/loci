[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loci"
version = "0.1.0"
description = "Typed long-term memory for AI agents — one core, an MCP server and a Hermes plugin"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
loci-maintenance = "loci.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["loci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
